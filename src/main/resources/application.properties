# ===================================================================
# DATABASE CONFIGURATION (POSTGRESQL WITH LOCAL H2 FALLBACK)
# ===================================================================
# Spring Boot will auto-detect the perfect driver class based entirely on the URL scheme provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nextandb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Dynamically assigns the database translator engine (PostgreSQL in production, H2 locally)
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Instructs Hibernate to safely generate and structure database tables automatically
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# SERVER & APPLICATION MAILING CONFIGURATIONS
# ===================================================================
server.port=${PORT:8080}
spring.mvc.welcome-file=static/nextan-service-form.html

app.default-from=eunicetanyongnie@gmail.com
app.finance-emails=${FINANCE_EMAILS:unicorntanyongnie@gmail.com,finance2@nextan.com}
app.staff-emails=${STAFF_EMAILS:janicelav9@gmail.com,tech2@nextan.com,engineer3@nextan.com}

# File Upload Threshold Constraints (Accommodates signature images and engineering attachments)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# SENDGRID SMTP RELAY CONFIGURATION
# ===================================================================
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true