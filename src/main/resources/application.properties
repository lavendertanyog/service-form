# ===================================================================
# DATABASE CONFIGURATION (POSTGRESQL WITH LOCAL H2 FALLBACK)
# ===================================================================
# Dynamically uses Railway PostgreSQL when deployed, falls back to local H2 file if running on your machine
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nextandb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Let Hibernate automatically update database tables when structure changes
spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# SERVER & APP CONFIGURATIONS
# ===================================================================
server.port=${PORT:8080}
spring.mvc.welcome-file=static/nextan-service-form.html
app.default-from=eunicetanyongnie@gmail.com
app.finance-emails=${FINANCE_EMAILS:unicorntanyongnie@gmail.com,finance2@nextan.com}
app.staff-emails=${STAFF_EMAILS:janicelav9@gmail.com,tech2@nextan.com,engineer3@nextan.com}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# SENDGRID SMTP RELAY CONFIGURATION
# ===================================================================
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true